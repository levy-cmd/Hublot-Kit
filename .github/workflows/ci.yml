name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  # Privileged job (spec §10): real Docker, run as root.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo -E env "PATH=$PATH" go test -tags integration ./...

  binary:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - run: |
          out=$(./bin/hublot reset-token --data-dir "$RUNNER_TEMP/hk")
          echo "$out" | grep -q "jeton"
      - name: Smoke test (embedded UI and CSP)
        run: |
          ./bin/hublot --data-dir "$RUNNER_TEMP/hk2" --listen 127.0.0.1:7878 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:7878/login && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7878/login | grep -q "_app/immutable"
          curl -sI http://127.0.0.1:7878/login | grep -i "^content-security-policy:" | grep -q "sha256-"
